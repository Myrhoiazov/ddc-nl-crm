name: Deploy

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Install dependencies
              working-directory: client
              run: npm ci

            - name: Build production project
              working-directory: client
              run: npm run build:prod
            - name: Connect to server and deploy
              uses: appleboy/ssh-action@25ce8cbbcb08177468c7ff7ec5cbfa236f9341e1
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e

                      echo "🔧 Load NVM and Node environment..."
                      export NVM_DIR="/root/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                      export PATH="$NVM_DIR/versions/node/v20.19.5/bin:$PATH"

                      echo "✅ Pulling latest code..."
                      cd /var/www/project/frontend

                      git fetch --all
                      git pull origin main

                      echo "📦 Installing dependencies..."
                      npm ci

                      echo "🧹 Cleaning old build artifacts..."
                      rm -rf build/

                      echo "⚙️ Building project..."
                      npm run build:prod || echo "no build step"

                      echo "♻️ Restarting PM2..."
                      pm2 restart frontend

                      echo "✅ Deployment complete :- ) !"
